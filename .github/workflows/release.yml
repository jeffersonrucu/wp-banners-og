name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run PHPCS
        run: vendor/bin/phpcs

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Check version consistency
        run: php bin/check-version.php

      - name: Check the tag matches the plugin version
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' banners-og.php | tr -d '[:space:]')"

          if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}" >&2
            exit 1
          fi

      - name: Build the distributable
        run: bin/build-dist.sh

      - name: Run Plugin Check on the distributable
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./dist/banners-og

      - name: Build the distribution archive
        run: |
          echo "ZIP=banners-og-${GITHUB_REF_NAME#v}.zip" >> "$GITHUB_ENV"
          cd dist && zip -rq "../banners-og-${GITHUB_REF_NAME#v}.zip" banners-og

      - name: Publish the archive on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ZIP}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ZIP}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
